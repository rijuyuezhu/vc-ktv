<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VC KTV CDN + HTML 歌词实验</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{background:#131923;color:#f1f4f9;font:16px system-ui,"Noto Sans CJK SC",sans-serif;margin:0;padding:16px}
main{max-width:960px;margin:auto}h1{font-size:23px;margin:10px 0}p,small{color:#b7c1d0}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0;align-items:center}.controls label{font-size:13px}.controls input{max-width:300px}
button,input{font:inherit;padding:7px;border-radius:5px}button{cursor:pointer}
.stage{position:relative;background:#000;aspect-ratio:16/9;overflow:hidden;border-radius:8px}
video{width:100%;height:100%;object-fit:contain}
#captions{position:absolute;inset:auto 3% 7%;pointer-events:none;display:grid;gap:8px;text-align:center;text-shadow:0 2px 5px #000,1px 1px 6px #000;font-size:clamp(19px,3vw,40px);font-weight:700}
#captions .line{min-height:1.2em;color:#fafafa;overflow-wrap:anywhere}
#captions .timed{background-clip:text;-webkit-background-clip:text;color:transparent}
#status{padding:10px;background:#252e3d;border-radius:5px;overflow-wrap:anywhere}
</style></head>
<body><main><h1>VC KTV：B 站 CDN + HTML 歌词（隔离实验）</h1>
<p>仅验证原片浏览器播放和现有时间轴叠字。此页面不会改变 VC KTV 生产播放器，也不会生成或取代可下载烧录成片。</p>
<div class="controls"><label>媒体 URL <input id="media-url" type="url" placeholder="公开 360p MP4 或本地媒体 URL" size="38"></label>
<label>或本地文件 <input id="media-file" type="file" accept="video/mp4,video/webm"></label><button id="load" type="button">载入媒体</button></div>
<div class="controls"><label>时间轴 timeline.json <input id="timeline-file" type="file" accept="application/json"></label>
<label>展示计划 display_plan.json <input id="plan-file" type="file" accept="application/json"></label>
<label>歌词偏移（秒） <input id="offset" type="number" value="0" step="0.1" min="-60" max="60"></label></div>
<div class="stage"><video id="video" controls playsinline preload="auto"></video><div id="captions"><div class="line" id="line-0"></div><div class="line" id="line-1"></div></div></div>
<p id="status" role="status">选择本地原片或粘贴公开视频地址；载入时间轴后使用视频播放器播放/暂停/seek。</p>
<small>官方 iframe 无法直接访问内部 currentTime；跨站视频若遭到防盗链或链接过期，应回退现有本地烧录 MP4，不绕过权限限制。</small>
<script src="overlay.js" defer></script></main></body></html>
