<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VC-KTV · 网易云封面舞台（设计实验）</title>
  <style>
    *{box-sizing:border-box}
    :root{color-scheme:dark;font-family:system-ui,"Noto Sans CJK SC",sans-serif}
    body{margin:0;min-height:100svh;display:grid;place-content:center;gap:12px;background:#070913;color:#e8eafa;padding:16px}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;width:min(100%,1280px);margin:auto;font-size:13px;color:#a5abc4}
    .toolbar .buttons{display:flex;gap:8px}
    .toolbar button{border:1px solid #49526d;background:#202943;color:white;border-radius:10px;padding:8px 12px;cursor:pointer}
    .toolbar button.active{background:#6264d9;border-color:#8a8bf1}
    .stage{--art-size:32cqw;isolation:isolate;position:relative;overflow:hidden;width:min(calc(100vw - 32px),calc((100svh - 90px)*16/9),1280px);aspect-ratio:16/9;container-type:inline-size;border-radius:14px;background:#0d1026;color:#f8f7ff;box-shadow:0 28px 90px #000b}
    .stage::before{content:"";position:absolute;inset:-20%;z-index:-2;background:radial-gradient(ellipse at 31% 40%,#73549b9c 0%,transparent 36%),radial-gradient(ellipse at 83% 23%,#304c91a8 0%,transparent 39%),radial-gradient(ellipse at 58% 84%,#9a4c7f7e 0%,transparent 40%),#11142f;filter:blur(7cqw);animation:breathing 18s ease-in-out infinite alternate}
    .stage::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(125deg,#0b0d23b0 6%,transparent 52%,#070713a8 95%),linear-gradient(0deg,#060915c2 0%,transparent 32%)}
    .rings{position:absolute;left:-25%;top:-64%;width:105%;height:190%;border:1px solid #d5c7fb1c;border-radius:50%;box-shadow:0 0 0 4cqw #ffffff04,0 0 0 13cqw #ffffff02;transform:rotate(-20deg);pointer-events:none}
    .glow{position:absolute;inset:0;opacity:.32;background:repeating-linear-gradient(115deg,transparent 0 4cqw,#c3b5ff08 4.02cqw 4.07cqw,transparent 4.1cqw 10cqw);animation:breathing 16s ease-in-out infinite alternate;pointer-events:none}
    .art-shadow{position:absolute;left:9%;top:16.5%;width:32%;aspect-ratio:1;filter:blur(2cqw);background:#050510aa;transform:translate(1.2cqw,1.5cqw) rotate(-4deg)}
    .record{position:absolute;left:26%;top:18%;width:35cqw;aspect-ratio:1;border-radius:50%;opacity:0;background:radial-gradient(circle at 29% 24%,#b5a5dc5e,transparent 46%),repeating-radial-gradient(circle,#0b0b18 0 .55cqw,#49425c .64cqw .71cqw,#171626 .78cqw 1.18cqw);border:.65cqw solid #393449;box-shadow:0 0 1.5cqw #ab85f755,0 0 4cqw #000a;animation:rotate 18s linear infinite;transition:opacity .5s}
    .record::after{content:"";position:absolute;inset:40%;border-radius:50%;background:radial-gradient(circle,#111326 0 12%,#a58cb9 13% 66%,#1c1a30 67%)}
    .cover{position:absolute;left:8.5%;top:14.5%;width:32%;aspect-ratio:1;overflow:hidden;border-radius:1cqw;background:radial-gradient(circle at 75% 25%,#ffd09d99,transparent 20%),radial-gradient(circle at 33% 27%,#ff6f9a,transparent 33%),radial-gradient(circle at 68% 70%,#4d77cf,transparent 37%),linear-gradient(143deg,#6843b5,#231d56 62%,#10143b);border:.25cqw solid #ffffff59;box-shadow:0 1.7cqw 5cqw #000b,inset 0 0 1cqw #fff3;transform:rotate(-3deg);animation:float 11s ease-in-out infinite alternate;z-index:1}
    .cover::before{content:"";position:absolute;width:125%;height:120%;left:-13%;top:-13%;background:repeating-radial-gradient(ellipse at 68% 43%,transparent 0 2.8cqw,#ffd4ea45 2.9cqw 3.05cqw,transparent 3.14cqw 5.2cqw);transform:rotate(-23deg);opacity:.95}
    .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(24deg,#0b0b326b,transparent 55%,#ffe8ff30);mix-blend-mode:screen}
    .cover .mark{position:absolute;left:8%;bottom:9%;font-weight:800;font-size:4.6cqw;line-height:.92;letter-spacing:-.25cqw;text-shadow:0 .4cqw 2cqw #0007}
    .cover .series{position:absolute;left:9%;top:8%;font-size:1.06cqw;letter-spacing:.24cqw;font-weight:700}
    .meta{position:absolute;left:47%;top:22%;width:47%;z-index:1}
    .eyebrow{font-size:1.28cqw;letter-spacing:.24cqw;color:#cdc7ef;font-weight:800}
    .eyebrow strong{color:#f5aad2}
    .title{font-size:5.35cqw;letter-spacing:-.28cqw;line-height:1.08;font-weight:850;margin:2.1cqw 0 1cqw;text-shadow:0 .6cqw 2.5cqw #0005}
    .artist{font-size:1.65cqw;color:#d2d2ec;margin:0 0 3.1cqw}
    .spectrum{display:flex;align-items:flex-end;height:3.7cqw;gap:.33cqw;opacity:.76}
    .spectrum span{width:.38cqw;height:var(--h);border-radius:10px;background:linear-gradient(0deg,#8a7bfa,#f1a6d6);animation:meter var(--d) ease-in-out infinite alternate;transform-origin:center bottom}
    .progress{display:flex;align-items:center;gap:1.2cqw;margin-top:2cqw;font-size:1.05cqw;color:#b7b4d5}
    .progress .track{flex:1;height:.29cqw;border-radius:99px;background:#ffffff42;overflow:hidden}
    .progress .fill{width:38%;height:100%;border-radius:99px;background:linear-gradient(90deg,#9e89ff,#ffc7df);box-shadow:0 0 1cqw #c5aaff}
    .lyrics{position:absolute;bottom:5.6%;left:4%;right:4%;text-align:center;z-index:2;pointer-events:none}
    .lyrics .current{font-size:3.05cqw;letter-spacing:.11cqw;font-weight:850;line-height:1.45;color:#fff;-webkit-text-stroke:.16cqw #101020;text-shadow:0 .3cqw 1cqw #000a;paint-order:stroke fill}
    .lyrics .current .swept{background:linear-gradient(90deg,#ffd1a1 0%,#ff8faf 57%,#fff 58%,#fff 100%);background-clip:text;-webkit-background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 .65cqw #f993c04d)}
    .lyrics .next{font-size:2cqw;color:#eeeeffc2;margin-top:.3cqw;text-shadow:0 .2cqw .7cqw #000b}
    .stage.vinyl .record{opacity:1}
    .stage.vinyl .cover{left:5%;width:31%;top:15%;transform:rotate(-4deg)}
    .stage.vinyl .meta{left:55%;width:39%}
    .stage.vinyl::before{background:radial-gradient(ellipse at 33% 48%,#86477fcb,transparent 37%),radial-gradient(ellipse at 83% 18%,#3d4f98aa,transparent 46%),#100f23}
    @keyframes float{0%{translate:0 0}100%{translate:0 -.6cqw}}
    @keyframes breathing{0%{transform:scale(1)}100%{transform:scale(1.18) translate(-2%,1%)}}
    @keyframes meter{0%{transform:scaleY(.3)}100%{transform:scaleY(1)}}
    @keyframes rotate{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <header class="toolbar">
    <span>VC-KTV · 网易云封面舞台视觉实验（模拟素材，无真实播放）</span>
    <div class="buttons"><button type="button" data-style="ambient" class="active">氛围封面</button><button type="button" data-style="vinyl">黑胶舞台</button></div>
  </header>
  <main class="stage" id="stage" aria-label="网易云音乐视频背景视觉实验">
    <div class="rings"></div><div class="glow"></div><div class="art-shadow"></div><div class="record"></div>
    <div class="cover"><span class="series">VC / KTV ORIGINAL STAGE</span><span class="mark">NOVA<br>ECHO</span></div>
    <section class="meta"><div class="eyebrow"><strong>♫</strong> NETEASE MUSIC · DEMO</div><h1 class="title">Midnight<br>Signal</h1><p class="artist">演示曲目 / Original Mock Track</p><div class="spectrum" id="spectrum" aria-hidden="true"></div><div class="progress"><span>01:28</span><div class="track"><div class="fill"></div></div><span>03:42</span></div></section>
    <div class="lyrics"><div class="current"><span class="swept">当夜色慢慢流过星海</span></div><div class="next">下一句歌词在这里等待</div></div>
  </main>
  <script>
    const stage=document.getElementById('stage');
    for(let i=0;i<21;i++){
      const bar=document.createElement('span');
      bar.style.setProperty('--h',(24+(i*37)%78)+'%');
      bar.style.setProperty('--d',(1.4+(i*11%15)/10)+'s');
      document.getElementById('spectrum').append(bar);
    }
    document.querySelectorAll('[data-style]').forEach(button=>{
      button.onclick=()=>{
        stage.classList.toggle('vinyl',button.dataset.style==='vinyl');
        document.querySelectorAll('[data-style]').forEach(b=>b.classList.toggle('active',b===button));
      };
    });
  </script>
</body>
</html>
