name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Lint and tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies from lockfile
        run: uv sync --locked --group dev

      - name: Pre-commit
        run: uv run --no-sync pre-commit run --all-files

      - name: Install media test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk

      - name: Python tests
        run: uv run --no-sync pytest -q

      - name: Shell syntax
        run: bash -n scripts/*.sh

      - name: JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/tv.js
          node --check static/tv-overlay.js
          node --test tests/test_tv_buffering.cjs tests/test_tv_html_overlay.cjs
          node --check experiments/bilibili-overlay/overlay.js
