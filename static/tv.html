<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07090d">
  <title>VC KTV | 电视播放</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#07090d;color:#edf5ff;font-family:system-ui,"Noto Sans CJK SC",sans-serif;overflow:hidden}
    video{width:100vw;height:100vh;object-fit:contain;background:#000}
    video.preloading{position:fixed;inset:0;opacity:0;pointer-events:none}
    #html-captions{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
    #html-captions[hidden]{display:none}
    .html-caption-row{position:absolute;left:4%;right:4%;transform:translateY(-100%);text-align:center;font-weight:700;line-height:1.25;color:#fff;overflow-wrap:anywhere;white-space:pre-wrap}
    .html-caption-outline{position:absolute;inset:0;color:#121212;-webkit-text-stroke:var(--ktv-stroke,6px) #121212;text-shadow:0 1px 2px #000;pointer-events:none}
    .html-caption-fill{position:relative;color:var(--ktv-base,#fff)}
    .html-caption-sweep{background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
    #cover{position:fixed;inset:0;background:radial-gradient(circle at 45% 35%,#21364d,#080c13 65%);display:grid;place-content:center;text-align:center;gap:16px}
    #cover.hidden{display:none}h1{font-size:clamp(34px,6vw,76px);margin:0;letter-spacing:-2px}
    p{font-size:clamp(15px,2.1vw,24px);color:#a4b8cd;margin:0 auto;max-width:780px}
    button{border:0;border-radius:14px;background:#4f5bd5;padding:15px 25px;font-size:21px;color:#fff;font-weight:700;cursor:pointer}
    #song-banner{position:fixed;left:18px;bottom:12px;z-index:2;width:min(660px,calc(100vw - 36px));padding:5px;background:rgba(8,14,23,var(--banner-opacity,.85));border:1px solid #ffffff26;border-radius:11px;color:#edf5ff;pointer-events:none}
    .song-banner-row{display:flex;align-items:center;gap:10px;min-width:0;padding:5px 9px;border-radius:6px;font-size:clamp(13px,1.5vw,17px);line-height:1.45}
    .song-banner-label{flex:none;width:50px;color:#a4b8cd;font-size:.82em}
    .song-banner-value{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #next-up-row{transition:background .25s,color .25s}
    #next-up-row.highlight{background:#395f92;color:#fff}
    #error{color:#ffb1ac;max-width:780px}
    #panel-toggle{position:fixed;right:16px;top:16px;z-index:7;padding:10px 14px;font-size:16px;background:#151b27c9}
    #controls{position:fixed;right:16px;top:68px;z-index:7;width:min(336px,calc(100vw - 32px));max-height:calc(100vh - 84px);overflow:auto;padding:15px;border:1px solid #ffffff25;border-radius:13px;background:#172131f3;box-shadow:0 8px 28px #000a}
    #controls[hidden]{display:none}
    #controls h2{font-size:16px;margin:0 0 6px}
    #controls p{font-size:13px;margin:0;color:#b4c4d8}
    #now-playing{margin:0 0 2px!important;color:#d2dfed!important;overflow-wrap:anywhere}
    #controls button:disabled{opacity:.35;cursor:default}
    #controls input{min-width:0;accent-color:#7e92ed}
    .remote-buttons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
    .remote-buttons button,.remote-offsets button{display:grid;place-items:center;min-height:48px;padding:8px 4px;border:1px solid #ffffff31;border-radius:9px;background:#253146;color:#e8f1ff;cursor:pointer}
    .remote-buttons button:hover,.remote-offsets button:hover{background:#354463;border-color:#7d91e8}
    .remote-buttons button img{width:21px;height:21px;filter:brightness(0) invert(1)}
    .remote-progress{text-align:center!important;font-size:12px!important;font-variant-numeric:tabular-nums;margin:9px 0!important}
    .remote-range{display:flex;align-items:center;gap:11px;margin:12px 0 0}
    .remote-range img{width:18px;height:18px;filter:brightness(0) invert(1)}
    .remote-range input{flex:1}
    .remote-extra{display:flex;flex-direction:column;gap:12px;border-top:1px solid #ffffff22;margin-top:13px;padding-top:13px}
    .remote-extra[hidden],.remote-offset-section[hidden]{display:none}
    .remote-offset-section{display:flex;flex-direction:column;gap:10px}
    .remote-label{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#b4c4d8;font-size:12px}
    .remote-opacity{flex-direction:column;align-items:stretch;gap:7px;font-size:12px;color:#b4c4d8}
    .remote-offsets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
    .remote-offsets button{min-height:42px;font-size:12px;padding-inline:2px}
    #controls label.remote-toggle{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:#b4c4d8}
    .remote-toggle input{flex:none;min-height:auto}
    #banner-transparency{width:100%}
    #banner-transparency-value[hidden]{display:none}
    #progress{font-variant-numeric:tabular-nums}
    .upcoming h2{margin:0!important}
    #next-list{list-style:none;padding:0;margin:0;font-size:13px}
    #next-list li{padding:8px 0;border-bottom:1px solid #ffffff17;overflow-wrap:anywhere}
    #control-error{color:#ffb1ac!important}
    [data-provider="bilibili"]{--provider-image:url('/icons/bilibili.svg')}
    [data-provider="netease"]{--provider-image:url('/icons/neteasecloudmusic.svg')}
    #status[data-provider],#next-up[data-provider],#now-playing[data-provider]{background:var(--provider-image) no-repeat left center;background-size:17px 17px;padding-left:24px}
    #next-list li[data-provider]{background:var(--provider-image) no-repeat 22px center;background-size:17px 17px;padding-left:46px}
    @media(max-width:560px){#controls{top:62px;max-height:calc(100vh - 74px)}.remote-offsets{grid-template-columns:repeat(3,minmax(0,1fr))}}
  </style>
</head>
<body>
  <video id="video" playsinline preload="auto"></video>
  <video id="preload" class="preloading" playsinline preload="auto"></video>
  <div id="html-captions" aria-label="实时卡拉 OK 字幕" hidden></div>
  <div id="cover">
    <h1>♪ VC KTV</h1>
    <p id="subtitle">开始播放后自动切歌</p>
    <div><button id="start">▶ 开始</button></div>
    <p id="error" aria-live="polite"></p>
  </div>
  <div id="song-banner" aria-label="播放队列">
    <div class="song-banner-row"><span class="song-banner-label">当前</span><span class="song-banner-value" id="status" aria-live="polite">等待播放</span></div>
    <div class="song-banner-row" id="next-up-row"><span class="song-banner-label">下一首</span><span class="song-banner-value" id="next-up" aria-live="polite">正在获取队列……</span></div>
  </div>
  <button id="panel-toggle" type="button" aria-expanded="false" aria-controls="controls">☰ 控制</button>
  <aside id="controls" aria-label="电视播放控制" hidden>
    <p id="now-playing">暂无正在播放的歌曲</p>
    <div class="remote-buttons" aria-label="播放控制">
      <button id="pause-resume" type="button" aria-label="暂停或继续" title="暂停或继续"><img id="pause-icon" src="/icons/pause.svg" alt=""></button>
      <button id="restart" type="button" aria-label="从头重播" title="从头重播"><img src="/icons/rotate-ccw.svg" alt=""></button>
      <button id="skip" type="button" aria-label="跳过" title="跳过"><img src="/icons/skip-forward.svg" alt=""></button>
      <button id="replay-next" type="button" aria-label="下一首重唱" title="下一首重唱"><img src="/icons/repeat-2.svg" alt=""></button>
    </div>
    <p id="progress" class="remote-progress">0:00 / 0:00</p>
    <label class="remote-range"><img src="/icons/volume-2.svg" alt="" aria-hidden="true"><input id="volume" type="range" min="0" max="100" value="100" aria-label="音量"></label>
    <div class="remote-extra">
      <div id="offset-controls" class="remote-offset-section" hidden>
        <div class="remote-label">字幕偏移 <output id="offset-value">+0.0s</output></div>
        <div class="remote-offsets">
          <button type="button" data-offset="-50">−5s</button>
          <button type="button" data-offset="-10">−1s</button>
          <button type="button" data-offset="-1">−0.1s</button>
          <button type="button" data-offset="1">+0.1s</button>
          <button type="button" data-offset="10">+1s</button>
          <button type="button" data-offset="50">+5s</button>
        </div>
      </div>
      <label class="remote-range remote-opacity" for="banner-transparency">
        <span>信息框透明度</span>
        <input id="banner-transparency" type="range" min="0" max="100" step="5" value="15" aria-label="信息框透明度">
      </label>
      <output id="banner-transparency-value" hidden>15%</output>
      <label class="remote-toggle"><input id="smooth-buffer" type="checkbox">稳播模式</label>
    </div>
    <div class="remote-extra upcoming">
      <h2>接下来</h2>
      <ul id="next-list"><li>正在获取队列……</li></ul>
    </div>
    <p id="control-error" role="alert"></p>
  </aside>
  <script src="/tv-overlay.js" defer></script>
  <script src="/tv.js" defer></script>
</body>
</html>
