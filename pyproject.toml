[project]
name = "vc-ktv"
version = "0.5.0"
description = "Self-hosted Bilibili Vocaloid KTV requests, lyric selection and automatic playback"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.18",
  "beautifulsoup4>=4.12,<5",
  "textgrid>=1.6,<2",
  "yt-dlp>=2026.10,<2027",
  "numpy>=1.26,<3",
  "soundfile>=0.12,<1",
  "pydantic>=2.9,<3",
]

[dependency-groups]
dev = [
    "pre-commit>=4,<5",
    "pre-commit-hooks>=6,<7",
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
